[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "choice-eval-toolkit"
version = "0.1.0"
description = "Audit multiple-choice evaluation runs for position/label, length and ordering bias, and measure answer confidence calibration — pure statistics, no model calls required."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SCUTxyx" }]
keywords = ["evaluation", "multiple-choice", "position-bias", "calibration", "selective-prediction", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
choice-eval = "choice_eval.cli:main"

[tool.setuptools.packages.find]
include = ["choice_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
